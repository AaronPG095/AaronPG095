name: Update public profile activity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: write

concurrency:
  group: profile-public-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Test profile renderer
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Update public statistics and recent contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_TOTALS_TOKEN: ${{ secrets.PROFILE_TOTALS_TOKEN }}
        run: |
          if [ -z "$PROFILE_TOTALS_TOKEN" ]; then
            echo "::warning::PROFILE_TOTALS_TOKEN is not set; refreshing public releases and PRs while preserving the telemetry card."
          fi
          python3 scripts/update_profile.py

      - name: Commit changes if needed
        run: |
          git add README.md assets/github-stats.svg
          if git diff --cached --quiet; then
            echo "Profile is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh public profile activity"
          git push
